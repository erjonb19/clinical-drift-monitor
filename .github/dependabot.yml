# Backlog item 11: weekly, grouped dependency updates for Python, the Docker base image and the
# GitHub Actions. Each group arrives as one PR, reviewed and CI-gated like any other change.
# Ignore rules (owner, 2026-11-09): the API image stays on Python 3.11 (the repo's standard),
# and the model and training stack gets patch releases only, since a minor release can change
# the numbers behind committed results (flwr is held at 1.39.x on purpose: config/pip_audit_ignore.json).
# Cooldown (item 38): a version update waits 7 days after its release, so a hijacked release is
# more likely to be found and pulled before it reaches a PR here (GitHub's default is 3 days).
# Security updates skip Dependabot's cooldown, but uv.lock's exclude-newer (7 days, backlog
# item 26) still holds a fix back until it is 7 days old; for an urgent fix, add a one-off
# `exclude-newer-package` entry for that package in pyproject.toml (SECURITY_STANDARDS 4.3).
version: 2
updates:
  # uv (backlog item 26): Dependabot edits pyproject.toml and re-locks uv.lock together, so CI's
  # `uv sync --locked` accepts its PRs.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Leave a ">=" floor in pyproject.toml alone when the new release already satisfies it (#74
    # raised floors such as mlflow-skinny 2.16 to 3.18); uv.lock and exact pins still move.
    versioning-strategy: increase-if-necessary
    ignore:
      # flwr 1.39.x (held on purpose) needs uvicorn < 0.50; #74's uvicorn 0.54.0 broke the install.
      - dependency-name: uvicorn
        update-types: [version-update:semver-major, version-update:semver-minor]
      # flwr 1.39.x also needs fastapi >= 0.138, < 0.139; #83's fastapi 0.162.0 broke the install.
      - dependency-name: fastapi
        update-types: [version-update:semver-major, version-update:semver-minor]
      # The BiomedCLIP stack behind the committed research Phase B results (vlm extra): patches
      # only. #83 moved open_clip_torch 3 -> 4 and transformers 4 -> 5. transformers was moved
      # to 5.10.1 by hand for five security alerts (2026-11-13); no security update PR came for
      # them, so watch the alerts and bump by hand.
      - dependency-name: open_clip_torch
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: transformers
        update-types: [version-update:semver-major, version-update:semver-minor]
      # sympy 1.14 (torch's dependency, in uv.lock and docker/requirements.txt) needs
      # mpmath < 1.4; #108's mpmath 1.4.1 made the image's pins impossible to install. Patches only.
      - dependency-name: mpmath
        update-types: [version-update:semver-major, version-update:semver-minor]
      # onnxruntime: held at the version the Databricks ONNX job ran and the committed results
      # in results/phase3/onnx/ record, until the next Databricks deploy (owner, 2026-11-11).
      - dependency-name: onnxruntime
      # torch and torchvision: no updates at all (owner, 2026-11-10). Dependabot dropped the
      # +cpu label from the image's pins (#74). A bump is a hand change to
      # constraint-dependencies in pyproject.toml, then uv lock and the docker/requirements.txt
      # export, checked by test_the_image_keeps_the_cpu_torch_wheels.
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: numpy
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: scikit-learn
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: flwr
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: mlflow
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: mlflow-skinny
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
