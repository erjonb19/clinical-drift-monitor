# Backlog item 11: weekly, grouped dependency updates for Python, the Docker base image and the
# GitHub Actions. Each group arrives as one PR, reviewed and CI-gated like any other change.
# Ignore rules (owner, 2026-11-09): the API image stays on Python 3.11 (the repo's standard),
# and the model and training stack gets patch releases only, since a minor release can change
# the numbers behind committed results (flwr is held at 1.39.x on purpose: config/pip_audit_ignore.json).
# Cooldown (item 38): a version update waits 7 days after its release, so a hijacked release is
# more likely to be found and pulled before it reaches a PR here. Security updates do not wait.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # No lockfile: leave a ">=" floor alone when the new release already satisfies it (#74 raised
    # floors such as mlflow-skinny 2.16 to 3.18); exact pins are still bumped.
    versioning-strategy: increase-if-necessary
    ignore:
      # flwr 1.39.x (held on purpose) needs uvicorn < 0.50; #74's uvicorn 0.54.0 broke the install.
      - dependency-name: uvicorn
        update-types: [version-update:semver-major, version-update:semver-minor]
      # flwr 1.39.x also needs fastapi >= 0.138, < 0.139; #83's fastapi 0.162.0 broke the install.
      - dependency-name: fastapi
        update-types: [version-update:semver-major, version-update:semver-minor]
      # The BiomedCLIP stack behind the committed research Phase B results (vlm extra): patches
      # only. #83 moved open_clip_torch 3 -> 4 and transformers 4 -> 5.
      - dependency-name: open_clip_torch
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: transformers
        update-types: [version-update:semver-major, version-update:semver-minor]
      # torch and torchvision: no updates at all (owner, 2026-11-10). Dependabot drops the
      # +cpu label in docker/constraints.txt and cannot see the Dockerfile's RUN line (#74), so a
      # bump is a hand change to both, checked by test_the_image_keeps_the_cpu_torch_wheels.
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: numpy
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: scikit-learn
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: flwr
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: mlflow
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: mlflow-skinny
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
