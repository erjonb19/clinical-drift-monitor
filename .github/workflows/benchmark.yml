# Backlog item 13: the serving benchmark on a GitHub runner, by hand only. It uses the CI test
# bundle (untrained weights), so its numbers are serving speed, never accuracy. The results file
# is uploaded as an artifact; committing it is a normal PR.
name: Serving benchmark

on:
  workflow_dispatch:
    inputs:
      requests:
        description: "Requests per concurrency level"
        required: false
        default: "200"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Backlog item 26: uv, pinned by version and its release SHA-256, installs only what
      # uv.lock records (hashed, from releases at least 7 days old).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          checksum: "aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967"
          enable-cache: false
      - name: Install (locked)
        run: |
          uv sync --locked --python 3.11 --extra train --extra serve --extra api
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Test bundle (untrained)
        run: python scripts/make_test_bundle.py --out dist/test_bundle
      - name: Benchmark
        env:
          REQUESTS: ${{ inputs.requests }}
        run: |
          PYTHONPATH=. python scripts/load_test.py --bundle dist/test_bundle --requests "$REQUESTS" \
            --where "GitHub Actions ubuntu-latest runner" --out benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ github.run_id }}
          path: benchmark.json
