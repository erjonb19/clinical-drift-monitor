# Backlog item 13: the serving benchmark on a GitHub runner, by hand only. It uses the CI test
# bundle (untrained weights), so its numbers are serving speed, never accuracy. The results file
# is uploaded as an artifact; committing it is a normal PR.
name: Serving benchmark

on:
  workflow_dispatch:
    inputs:
      requests:
        description: "Requests per concurrency level"
        required: false
        default: "200"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,serve,api]"
      - name: Test bundle (untrained)
        run: python scripts/make_test_bundle.py --out dist/test_bundle
      - name: Benchmark
        env:
          REQUESTS: ${{ inputs.requests }}
        run: |
          PYTHONPATH=. python scripts/load_test.py --bundle dist/test_bundle --requests "$REQUESTS" \
            --where "GitHub Actions ubuntu-latest runner" --out benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ github.run_id }}
          path: benchmark.json
