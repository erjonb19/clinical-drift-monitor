# Builds the API's Docker image and smoke-tests it, with a CI-only test bundle (untrained
# weights; the real bundle is never in git). Nothing is pushed anywhere.
name: Docker

on:
  # Every push to every branch (backlog item 6), and every pull request.
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Backlog item 26: uv, pinned by version and its release SHA-256, installs the packages
      # uv.lock records, hash-checked, from releases at least 7 days old. 0.13.4 or later: older
      # uv trusts a compromised root CA (GHSA-hq85-5cpj-mr62). The project's own build backend
      # (setuptools) is pinned by version, not hash: uv does not lock build dependencies.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          checksum: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
          enable-cache: false
      - name: Test bundle (untrained, CI only)
        run: |
          uv sync --locked --no-python-downloads --python 3.11 --extra train
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python scripts/make_test_bundle.py --out dist/bundle
      - name: Build the image
        run: docker build -t cdm-api:ci .
      - name: Smoke test
        run: |
          docker run -d --name api -p 7860:7860 cdm-api:ci
          for i in $(seq 1 60); do curl -sf http://localhost:7860/health && break; sleep 2; done
          python - <<'PY'
          import io, json, urllib.error, urllib.request
          from PIL import Image
          buf = io.BytesIO(); Image.new("RGB", (320, 320), (180, 120, 100)).save(buf, format="JPEG")
          req = urllib.request.Request("http://localhost:7860/predict", data=buf.getvalue(), headers={"Content-Type": "image/jpeg"})
          out = json.load(urllib.request.urlopen(req, timeout=60))
          assert "not for medical use" in out["notice"] and "non-commercial" in out["license"], out
          bad = urllib.request.Request("http://localhost:7860/predict", data=b"not an image", headers={"Content-Type": "image/jpeg"})
          try:
              urllib.request.urlopen(bad, timeout=30)
              raise SystemExit("a non-image was accepted")
          except urllib.error.HTTPError as err:
              assert err.code == 400, err.code
          health = json.load(urllib.request.urlopen("http://localhost:7860/health"))
          assert health["predictions"] == 1 and health["rejected"] == 1, health
          allowed = {"status", "model_version", "notice", "predictions", "rejected", "quarantined",
                     "rate_limited", "latency_ms_p50", "latency_ms_p95"}
          assert set(health) == allowed, set(health) ^ allowed  # counts and timing only
          print("smoke test passed", health)
          PY
          if docker logs api 2>&1 | grep -q -E "POST /predict|172\.17\."; then echo "access log or client address found"; exit 1; fi
          # No upload may land on the container's disk: list every file the container added.
          docker diff api | tee changes.txt
          # Allowed: /tmp itself and the empty cache directory torch creates at start-up.
          if grep -v -E " /(tmp|home/demo|tmp/torchinductor_demo)$" changes.txt | grep -q .; then echo "unexpected files written"; exit 1; fi
      # Backlog items 11 and 39: scan the built image; fixable CRITICAL and HIGH findings fail the
      # build. Accepted ones go in .trivyignore with their reason. The action is pinned to a commit.
      - name: Image scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cdm-api:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table
      - name: Container logs
        if: always()
        run: docker logs api || true
