# Backlog item 1: fails loudly when the monthly drift job (cdm-phase3-monthly-drift, job
# 524433148303929) has no run started by its schedule since 06:00 UTC on the 1st. Runs on the
# 2nd of each month, and by hand for any month. Needs three repo secrets from a service principal
# that can view that one job and nothing else (owner creates it; until then every run fails as
# "not configured", never as a pass). No secret is used on pushes or pull requests.
name: Drift watchdog

on:
  schedule:
    - cron: "17 7 2 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to check (YYYY-MM); default the current month"
        required: false
        default: ""
      job_id:
        description: "Job to check (digits); default the monthly job. Item 1's rehearsal uses this."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: drift-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Check the scheduled run
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          MONTH: ${{ inputs.month }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          args=()
          if [ -n "$MONTH" ]; then args+=(--month "$MONTH"); fi
          if [ -n "$JOB_ID" ]; then
            [[ "$JOB_ID" =~ ^[0-9]{1,20}$ ]] || { echo "::error::job_id must be digits"; exit 2; }
            args+=(--job-id "$JOB_ID")
          fi
          python scripts/watchdog.py "${args[@]}"
