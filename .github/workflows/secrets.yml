# Backlog item 25: scan the whole git history for secrets on every push and pull request,
# with gitleaks' default rules plus the narrow allowlist in .gitleaks.toml. The binary is a
# pinned release checked against its published SHA-256 (no third-party action).
name: Secrets

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned, SHA-256 checked)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o /tmp/gitleaks.tgz "$url"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p /tmp/gitleaks && tar -xzf /tmp/gitleaks.tgz -C /tmp/gitleaks gitleaks
      - name: The scan catches a planted key (self-test)
        run: |
          # Actions runs steps with bash -e; turn it off so gitleaks' exit status is captured.
          set +e -u
          t=$(mktemp -d) && cd "$t" && git init -q .
          # A fake AWS key made at run time, so no key-shaped string is committed here.
          key="AKIA$(head -c 400 /dev/urandom | tr -dc 'A-Z2-7' | head -c 16)"
          printf 'aws_access_key_id = %s\n' "$key" > leak.txt
          git add leak.txt && git -c user.email=ci@example.invalid -c user.name=ci commit -qm leak
          /tmp/gitleaks/gitleaks git --no-banner --redact -c "$GITHUB_WORKSPACE/.gitleaks.toml" .
          status=$?
          if [ "$status" -ne 1 ]; then echo "::error::gitleaks exited $status on a planted key, not 1"; exit 1; fi
      - name: Scan the repository's history
        run: /tmp/gitleaks/gitleaks git --no-banner --redact -c .gitleaks.toml .
