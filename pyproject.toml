[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdm"
version = "0.1.0"
description = "Clinical imaging drift monitor: a skin lesion classifier served with an out-of-distribution score."
requires-python = ">=3.11"
# The core is what the Databricks ingest task and pipeline need: no torch, so the pipeline
# does not install a deep learning stack just to decode images.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Training, OOD scoring and the gold embeddings task.
train = [
    # CI and local dev install the CPU wheels from download.pytorch.org.
    "torch>=2.4",
    "torchvision>=0.19",
    # 3.x is the release that serves the native 224px MedMNIST+ files.
    "medmnist>=3.0",
]
# Federated training (cdm.federated): Flower's FedAvg and FedProx strategies.
federated = [
    "flwr==1.39.0",
]
# The governed cohort service (cdm.cohort, scripts/cohort.py): phenotype files and DuckDB.
cohort = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
]
# The public cohort demo (app/cohort_demo.py). Not in CI: its logic is tested via cdm.demo.
demo = [
    "streamlit>=1.40",
]
# BiomedCLIP for research Phase B (cdm.vlm), on the Databricks GPU job and locally. Not in CI.
vlm = [
    "open_clip_torch==3.3.0",
    "transformers==4.57.6",
]
# Phase 3 serving (cdm.serve_onnx): ONNX export and ONNX Runtime on CPU. In CI.
serve = [
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
    "onnxscript==0.7.2",
]
# The public research API (app/api): FastAPI on CPU. In CI.
api = [
    "fastapi==0.138.2",
    "uvicorn==0.49.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
]
# Logging committed results files to Databricks MLflow (scripts/log_evidence.py). Not in CI.
evidence = [
    "mlflow-skinny>=2.16",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-PyYAML",
    # The G5 labelling workbook (cdm.extract.write_workbook).
    "openpyxl==3.1.5",
]

[project.scripts]
# Databricks job tasks run these as python_wheel_task entry points.
cdm-ingest = "cdm.ingest:main"
cdm-gold = "cdm.gold:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# reference/ is read-only course history, not code this repo maintains.
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks get `spark` and `dbutils` from the runtime, and import after
# their widget and %pip cells.
"databricks/notebooks/*" = ["F821", "E501", "E402"]
# Document templates: long lines are the documents' own prose and tables.
"scripts/build_docs.py" = ["E501"]

[tool.mypy]
files = ["src", "tests", "scripts", "pipelines"]
python_version = "3.11"
# Scripts import shared helpers from each other.
mypy_path = "scripts"
strict = true
# None of these ship type information.
[[tool.mypy.overrides]]
module = ["medmnist.*", "sklearn.*", "torchvision.*", "pyspark.*", "scipy.*", "mlflow.*", "open_clip.*",
          "onnxruntime.*", "huggingface_hub.*", "openpyxl.*"]
ignore_missing_imports = true

# The pipeline's decorators come from pyspark, which is not installed outside Databricks.
[[tool.mypy.overrides]]
module = ["lakehouse"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so tests can import the app/ package (app.api).
pythonpath = ["."]
addopts = "-q"
