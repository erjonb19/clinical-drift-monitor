[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdm"
version = "0.1.0"
description = "Clinical imaging drift monitor: a skin lesion classifier served with an out-of-distribution score."
requires-python = ">=3.11"
# The core is what the Databricks ingest task and pipeline need: no torch, so the pipeline
# does not install a deep learning stack just to decode images.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Training, OOD scoring and the gold embeddings task.
train = [
    # CI and local dev install the CPU wheels from download.pytorch.org.
    "torch>=2.6",
    "torchvision>=0.19",
    # 3.x is the release that serves the native 224px MedMNIST+ files.
    "medmnist>=3.0",
]
# Federated training (cdm.federated): Flower's FedAvg and FedProx strategies.
federated = [
    "flwr==1.39.0",
]
# The governed cohort service (cdm.cohort, scripts/cohort.py): phenotype files and DuckDB.
cohort = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
]
# The public cohort demo (app/cohort_demo.py). Not in CI: its logic is tested via cdm.demo.
demo = [
    "streamlit>=1.40",
]
# BiomedCLIP for research Phase B (cdm.vlm), on the Databricks GPU job and locally. Not in CI.
vlm = [
    "open_clip_torch==3.3.0",
    "transformers==4.57.6",
]
# Phase 3 serving (cdm.serve_onnx): ONNX export and ONNX Runtime on CPU. In CI.
serve = [
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
    "onnxscript==0.7.2",
]
# The public research API (app/api): FastAPI on CPU. In CI.
api = [
    "fastapi==0.138.2",
    "uvicorn==0.49.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
]
# Logging committed results files to Databricks MLflow (scripts/log_evidence.py). Not in CI.
evidence = [
    "mlflow-skinny>=2.16",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-PyYAML",
    # The G5 labelling workbook (cdm.extract.write_workbook).
    "openpyxl==3.1.5",
]

[project.scripts]
# Databricks job tasks run these as python_wheel_task entry points.
cdm-ingest = "cdm.ingest:main"
cdm-gold = "cdm.gold:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# reference/ is read-only course history, not code this repo maintains.
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "S"]
# Security rules (S, backlog item 36), each exception with its reason:
# S603/S607: every subprocess call is an argument list (no shell) to git, databricks, docker or
# pip found on PATH; S602 (shell=True) stays on.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks get `spark` and `dbutils` from the runtime, and import after
# their widget and %pip cells. S101: they run on Databricks, never under python -O, and their
# asserts are integrity checks that stop the job; S108: /tmp is the job's own ephemeral disk.
"databricks/notebooks/*" = ["F821", "E501", "E402", "S101", "S108"]
# Document templates: long lines are the documents' own prose and tables.
"scripts/build_docs.py" = ["E501"]
# Tests assert by design and write to pytest's own temporary folders. S608: tests build SQL
# from fixture table names and temporary paths, some of them on purpose as the attacks a
# locked-down engine must refuse (tests/test_cohort.py, item 47); no outside input.
"tests/*" = ["S101", "S108", "S310", "S324", "S608"]
# SQL built only from repository constants (table and column names, allowlisted cohort
# definitions; src/cdm/cohort.py compiles validated integers and identifiers, audited
# 2026-11-10); no outside input reaches these strings.
"src/cdm/cohort.py" = ["S608"]
"scripts/omop_build_report.py" = ["S608"]
"scripts/phase1_export_evidence.py" = ["S608", "S310"]
"scripts/phase2_stage1_evidence.py" = ["S608"]
"scripts/cost_table.py" = ["S608"]
"scripts/lineage_edges.py" = ["S608"]
"scripts/v2_data_checks.py" = ["S608"]  # pipeline id, flow names and a run time from the owner's own workspace
"databricks/notebooks/lineage_rewrite.py" = ["F821", "E501", "E402", "S101", "S108", "S608"]
# urlopen on fixed https hosts named in the code (ISIC, Dataverse, Anthropic, the owner's
# Databricks host from its own secret) or the local test server; no user-supplied scheme.
"src/cdm/data.py" = ["S310"]
"src/cdm/extract.py" = ["S310"]
"scripts/watchdog.py" = ["S310"]
"scripts/load_test.py" = ["S310"]
"scripts/api_local_check.py" = ["S310"]
# urlopen on URLs returned by the ISIC API (the pagination `next` link, image file URLs); since
# item 47, `next` is followed only over https to the same host, and reads are size-capped.
"src/cdm/sources.py" = ["S310"]
"scripts/detector_quality.py" = ["S310"]
"scripts/make_smoke_manifest.py" = ["S310"]
"databricks/notebooks/scheduler_probe.py" = ["F821", "E501", "E402", "S101", "S108", "S310"]

[tool.mypy]
files = ["src", "tests", "scripts", "pipelines"]
python_version = "3.11"
# Scripts import shared helpers from each other.
mypy_path = "scripts"
strict = true
# None of these ship type information.
[[tool.mypy.overrides]]
module = ["medmnist.*", "sklearn.*", "torchvision.*", "pyspark.*", "scipy.*", "mlflow.*", "open_clip.*",
          "onnxruntime.*", "huggingface_hub.*", "openpyxl.*"]
ignore_missing_imports = true

# The pipeline's decorators come from pyspark, which is not installed outside Databricks.
[[tool.mypy.overrides]]
module = ["lakehouse"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so tests can import the app/ package (app.api).
pythonpath = ["."]
addopts = "-q"
